name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # 3.11 下 PySide6 进程退出阶段崩溃（160 passed 仍 exit 1），3.13 与开发环境一致
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        shell: pwsh
        run: |
          # PySide6 在 windows runner 上 pytest 全绿后进程退出阶段偶发崩溃（access violation，
          # 见 2026-09-11 的 03f81c6 run：166 passed 仍 exit 1）——退出码非零时重试，最多 3 次
          for ($i = 1; $i -le 3; $i++) {
            python -m pytest tests/ -q
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "::warning::pytest attempt $i exited $LASTEXITCODE（teardown 偶发崩溃），重试"
          }
          exit $LASTEXITCODE

  # 构建冒烟 canary：单版本 onedir 构建（含 WebEngine）通过才放行
  # （防 spec/入口腐烂；体积大、耗时比原 lite canary 长，可接受）
  build-canary:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build (onedir, WebEngine included)
        run: python -m PyInstaller --noconfirm --clean CtrlTranslate.spec

      - name: Sanity check
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\CtrlTranslate\CtrlTranslate.exe")) {
            throw "missing build output: dist\CtrlTranslate\CtrlTranslate.exe"
          }
          # PyInstaller onedir 布局：依赖 DLL 全在 _internal\（Qt 在 _internal\PySide6\）
          if (-not (Get-ChildItem "dist\CtrlTranslate\_internal" -Recurse -Filter "Qt6Core*.dll")) {
            throw "Qt DLLs missing from onedir output"
          }
