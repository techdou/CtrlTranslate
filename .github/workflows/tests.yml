name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # 3.11 下 PySide6 进程退出阶段崩溃（160 passed 仍 exit 1），3.13 与开发环境一致
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        shell: pwsh
        run: |
          # PySide6 在 windows runner 上 pytest 全绿后进程退出阶段偶发崩溃（access violation，
          # 见 2026-09-11 的 03f81c6 run：166 passed 仍 exit 1）——退出码非零时重试，最多 3 次
          for ($i = 1; $i -le 3; $i++) {
            python -m pytest tests/ -q
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "::warning::pytest attempt $i exited $LASTEXITCODE（teardown 偶发崩溃），重试"
          }
          exit $LASTEXITCODE
